# Déploiement en un clic sur Render (https://render.com) : New > Blueprint > choisir ce dépôt.
services:
  - type: web
    name: samatour
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/public
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: NODE_VERSION
        value: "20"
      # Clé de l'API Claude pour l'assistant IA (à saisir dans le tableau de bord Render, jamais dans le code).
      # Sans clé, l'assistant fonctionne en mode de base.
      - key: ANTHROPIC_API_KEY
        sync: false
